name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Derle
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log

      - name: Derleme hatalarini raporla
        if: failure()
        run: |
          grep -E "\[ERROR\]|\[WARNING\].*\.java" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SanalDepo
          path: target/SanalDepo-*.jar

      - name: Release yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SanalDepo ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: target/SanalDepo-*.jar
